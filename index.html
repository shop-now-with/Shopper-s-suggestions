<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Shopper's Suggestions</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#fff;
  color:#0b1730;
  overflow-x:hidden;
}

/* =========================
   ANIMATED BACKGROUND
========================= */

body:before,
body:after{
  content:"";
  position:fixed;
  z-index:-5;
  pointer-events:none;
  border-radius:50%;
  filter:blur(75px);
  opacity:.32;
}

body:before{
  width:420px;
  height:420px;
  left:-170px;
  top:180px;
  background:radial-gradient(
    circle,
    #ff7a18,
    transparent 68%
  );
  animation:orbA 14s ease-in-out infinite alternate;
}

body:after{
  width:520px;
  height:520px;
  right:-230px;
  top:520px;
  background:radial-gradient(
    circle,
    #1559a6,
    transparent 68%
  );
  animation:orbB 17s ease-in-out infinite alternate;
}

@keyframes orbA{
  0%{
    transform:translate(0,0) scale(.85);
  }

  50%{
    transform:translate(150px,80px) scale(1.15);
  }

  100%{
    transform:translate(20px,250px) scale(.9);
  }
}

@keyframes orbB{
  0%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(-130px,-100px) scale(.8);
  }

  100%{
    transform:translate(-20px,180px) scale(1.2);
  }
}

/* Moving background lines */

.bg-lines{
  position:fixed;
  inset:0;
  z-index:-4;
  pointer-events:none;
  overflow:hidden;
  opacity:.55;
}

.bg-lines span{
  position:absolute;
  height:1px;
  width:42vw;

  background:
    linear-gradient(
      90deg,
      transparent,
      #0c3768,
      transparent
    );

  animation:lineMove 10s linear infinite;
}

.bg-lines span:nth-child(1){
  top:12%;
  left:-45%;
}

.bg-lines span:nth-child(2){
  top:29%;
  left:-60%;
  animation-delay:2s;
}

.bg-lines span:nth-child(3){
  top:51%;
  left:-50%;
  animation-delay:4s;
}

.bg-lines span:nth-child(4){
  top:73%;
  left:-55%;
  animation-delay:6s;
}

.bg-lines span:nth-child(5){
  top:88%;
  left:-40%;
  animation-delay:8s;
}

@keyframes lineMove{
  0%{
    transform:translateX(0) rotate(-4deg);
  }

  100%{
    transform:translateX(250vw) rotate(-4deg);
  }
}

/* Floating particles */

.particles{
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  overflow:hidden;
}

.particles i{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ff7117;
  box-shadow:0 0 14px #ff7117;
  animation:float 9s ease-in-out infinite;
}

.particles i:nth-child(1){
  left:8%;
  top:20%;
  animation-delay:-1s;
}

.particles i:nth-child(2){
  left:18%;
  top:70%;
  animation-delay:-5s;
}

.particles i:nth-child(3){
  left:31%;
  top:38%;
  animation-delay:-2s;
}

.particles i:nth-child(4){
  left:47%;
  top:82%;
  animation-delay:-7s;
}

.particles i:nth-child(5){
  left:64%;
  top:25%;
  animation-delay:-3s;
}

.particles i:nth-child(6){
  left:76%;
  top:62%;
  animation-delay:-6s;
}

.particles i:nth-child(7){
  left:88%;
  top:18%;
  animation-delay:-4s;
}

.particles i:nth-child(8){
  left:94%;
  top:86%;
  animation-delay:-8s;
}

@keyframes float{
  0%,100%{
    transform:translate(0,0) scale(.7);
    opacity:.2;
  }

  50%{
    transform:translate(35px,-55px) scale(1.5);
    opacity:.9;
  }
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  padding:12px 4%;

  background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);

  border-bottom:1px solid rgba(15,40,75,.09);

  animation:headerIn .8s ease both;
}

@keyframes headerIn{
  from{
    opacity:0;
    transform:translateY(-25px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.nav{
  max-width:1280px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  width:175px;
  height:58px;

  object-fit:contain;

  animation:logoPulse 5s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }
}

nav{
  display:flex;
  align-items:center;
  gap:25px;
}

nav a{
  color:#0b1730;
  text-decoration:none;

  font-size:14px;
  font-weight:750;

  position:relative;
  padding:9px 0;
}

nav a:after{
  content:"";

  position:absolute;
  left:0;
  bottom:2px;

  width:0;
  height:2px;

  border-radius:5px;

  background:
    linear-gradient(
      90deg,
      #ff6a00,
      #123d70
    );

  transition:.35s;
}

nav a:hover:after{
  width:100%;
}

.menu{
  display:none;
  font-size:27px;
  cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;

  max-width:1280px;
  margin:auto;

  padding:74px 5% 42px;

  text-align:center;
}

.hero:before{
  content:"";

  position:absolute;

  left:50%;
  top:35px;

  width:250px;
  height:250px;

  transform:translateX(-50%);

  border:1px solid rgba(20,70,120,.08);

  border-radius:50%;

  animation:ring 9s linear infinite;
}

.hero:after{
  content:"";

  position:absolute;

  left:50%;
  top:70px;

  width:180px;
  height:180px;

  transform:translateX(-50%);

  border:1px dashed rgba(255,106,0,.18);

  border-radius:50%;

  animation:ring 6s linear infinite reverse;
}

@keyframes ring{
  to{
    transform:translateX(-50%) rotate(360deg);
  }
}

.hero h1{
  position:relative;

  font-size:clamp(40px,7vw,78px);
  line-height:.98;

  font-weight:950;

  letter-spacing:-3px;

  background:
    linear-gradient(
      100deg,
      #ff6900,
      #ff8a2a 30%,
      #0b2e59 62%,
      #175d9f
    );

  -webkit-background-clip:text;
  color:transparent;

  background-size:250% auto;

  animation:
    gradientFlow 7s linear infinite,
    heroIn 1s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes gradientFlow{
  to{
    background-position:250% center;
  }
}

@keyframes heroIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.hero p{
  position:relative;

  margin:20px auto 0;

  max-width:650px;

  color:#667085;

  font-size:16px;
  line-height:1.7;

  animation:fadeUp 1.2s .15s both;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   SEARCH
========================= */

.search-wrap{
  position:relative;
  z-index:3;

  max-width:850px;

  margin:31px auto 0;

  display:flex;
  gap:10px;

  animation:fadeUp 1.2s .3s both;
}

.search-wrap input,
.search-wrap select{
  height:54px;

  border:1px solid rgba(16,24,40,.1);

  background:rgba(255,255,255,.82);

  backdrop-filter:blur(15px);

  border-radius:16px;

  padding:0 17px;

  font-size:15px;

  outline:none;

  box-shadow:
    0 10px 35px rgba(13,36,66,.06);

  transition:.3s;
}

.search-wrap input{
  flex:1;
}

.search-wrap select{
  min-width:190px;
}

.search-wrap input:focus,
.search-wrap select:focus{
  border-color:#ff7417;

  box-shadow:
    0 0 0 4px rgba(255,106,0,.08),
    0 15px 40px rgba(13,36,66,.09);
}

/* =========================
   PRODUCTS
========================= */

.products{
  max-width:1280px;
  margin:auto;

  padding:32px 4% 100px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin-bottom:24px;

  animation:fadeUp 1s both;
}

.section-head h2{
  font-size:28px;
  letter-spacing:-1px;
}

.section-head span{
  font-size:13px;
  color:#667085;
}

#status{
  text-align:center;
  padding:55px;
  color:#667085;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(290px,1fr)
    );

  gap:28px;
}

/* =========================
   CARD
========================= */

.card{
  position:relative;

  background:rgba(255,255,255,.88);

  border:1px solid rgba(15,40,75,.09);

  border-radius:25px;

  overflow:hidden;

  box-shadow:
    0 15px 55px rgba(15,40,75,.08);

  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    box-shadow .45s;

  animation:cardIn .75s both;
}

.card:before{
  content:"";

  position:absolute;

  z-index:4;

  inset:-2px;

  border-radius:27px;

  padding:1px;

  background:
    linear-gradient(
      110deg,
      transparent,
      rgba(255,106,0,.45),
      transparent,
      rgba(20,82,145,.4),
      transparent
    );

  background-size:300% 300%;

  animation:borderFlow 6s linear infinite;

  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  mask-composite:exclude;

  pointer-events:none;
}

.card:hover{
  transform:translateY(-9px);

  box-shadow:
    0 28px 75px rgba(15,40,75,.14);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(28px) scale(.97);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes borderFlow{
  to{
    background-position:300% 0;
  }
}

/* =========================
   IMAGE GALLERY
========================= */

.gallery{
  position:relative;

  aspect-ratio:1/1;

  background:
    linear-gradient(
      135deg,
      #f5f8fb,
      #fff
    );

  overflow:hidden;

  touch-action:pan-y;
}

.gallery:after{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent 20%,
      rgba(255,255,255,.7) 45%,
      transparent 65%
    );

  transform:translateX(-120%);

  animation:shine 7s ease-in-out infinite;

  pointer-events:none;
}

@keyframes shine{
  0%,55%{
    transform:translateX(-120%);
  }

  75%,100%{
    transform:translateX(120%);
  }
}

.gallery-track{
  height:100%;

  display:flex;

  transition:
    transform .48s cubic-bezier(.2,.8,.2,1);
}

.gallery-slide{
  min-width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.gallery-slide img{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  transition:transform .7s;
}

.card:hover .gallery-slide img{
  transform:scale(1.035);
}

.arrow{
  position:absolute;

  z-index:8;

  top:50%;

  transform:translateY(-50%);

  width:40px;
  height:40px;

  border:1px solid rgba(0,0,0,.06);

  border-radius:50%;

  background:rgba(255,255,255,.9);

  box-shadow:
    0 8px 22px rgba(0,0,0,.12);

  cursor:pointer;

  font-size:25px;

  color:#0b1730;

  transition:.3s;
}

.arrow:hover{
  transform:
    translateY(-50%)
    scale(1.12);
}

.left{
  left:12px;
}

.right{
  right:12px;
}

.dots{
  position:absolute;

  z-index:8;

  bottom:13px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:6px;

  padding:6px 9px;

  border-radius:99px;

  background:rgba(255,255,255,.72);

  backdrop-filter:blur(8px);
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#aab3bf;

  transition:.3s;
}

.dot.active{
  background:#0b2e59;

  transform:scale(1.35);
}

.counter{
  position:absolute;

  z-index:8;

  top:12px;
  right:12px;

  padding:6px 9px;

  border-radius:99px;

  background:rgba(11,23,48,.72);

  color:#fff;

  font-size:11px;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:21px;
}

.category{
  display:inline-block;

  margin-bottom:11px;

  padding:7px 10px;

  border-radius:99px;

  background:#fff0e5;

  color:#ed650d;

  font-size:10px;

  font-weight:900;

  letter-spacing:.7px;

  text-transform:uppercase;
}

.title{
  font-size:21px;
  line-height:1.25;

  color:#0b1730;

  margin-bottom:12px;
}

.description{
  font-size:14.5px;
  line-height:1.7;

  color:#667085;

  white-space:pre-wrap;
  word-break:break-word;

  margin-bottom:17px;
}

/* =========================
   VIDEO
========================= */

.video{
  margin-top:15px;

  border-radius:15px;

  overflow:hidden;

  background:#000;
}

.video video{
  width:100%;
  display:block;
}

/* =========================
   BUY BUTTON
========================= */

.buy{
  position:relative;

  display:block;

  overflow:hidden;

  width:100%;

  padding:14px 18px;

  border-radius:14px;

  text-align:center;

  text-decoration:none;

  color:#fff;

  font-size:13px;

  font-weight:900;

  letter-spacing:.3px;

  background:
    linear-gradient(
      105deg,
      #ff6500,
      #ff8125 35%,
      #0b2f5c 72%,
      #165f9f
    );

  background-size:220% 100%;

  animation:buttonFlow 5s linear infinite;

  box-shadow:
    0 10px 28px rgba(15,49,88,.16);

  transition:.3s;
}

.buy:before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(255,255,255,.4),
      transparent
    );

  transform:translateX(-120%);

  animation:buttonShine 4s infinite;
}

.buy:hover{
  transform:translateY(-2px);
}

@keyframes buttonFlow{
  to{
    background-position:220% 0;
  }
}

@keyframes buttonShine{
  0%,55%{
    transform:translateX(-120%);
  }

  75%,100%{
    transform:translateX(120%);
  }
}

/* =========================
   EMPTY / FOOTER
========================= */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:70px 20px;

  color:#667085;
}

footer{
  padding:50px 5%;

  text-align:center;

  color:#667085;

  border-top:1px solid #eee;

  background:rgba(248,250,252,.75);
}

footer strong{
  color:#0b1730;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    padding:9px 4%;
  }

  .logo{
    width:150px;
    height:52px;
  }

  .menu{
    display:block;
  }

  nav{
    display:none;

    position:absolute;

    top:70px;

    left:4%;
    right:4%;

    padding:17px;

    background:rgba(255,255,255,.94);

    backdrop-filter:blur(20px);

    border:1px solid #eee;

    border-radius:18px;

    box-shadow:
      0 18px 50px rgba(0,0,0,.12);

    flex-direction:column;

    gap:15px;
  }

  nav.open{
    display:flex;
  }

  .hero{
    padding:58px 5% 32px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .search-wrap{
    flex-direction:column;
  }

  .search-wrap select{
    width:100%;
  }

  .products{
    padding-left:4%;
    padding-right:4%;
  }

  .grid{
    grid-template-columns:1fr;
    gap:23px;
  }

  .section-head{
    align-items:start;
    gap:8px;
    flex-direction:column;
  }

  .arrow{
    width:36px;
    height:36px;
  }
}

/* Accessibility */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>

<!-- Animated background -->
<div class="bg-lines">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="particles">
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
</div>


<!-- HEADER -->

<header>

  <div class="nav">

    <img
      class="logo"
      src="2E7A6582-42BB-48D4-84D8-71C3DA3ED841.jpeg"
      alt="Shopper's Suggestions"
    >

    <div
      class="menu"
      onclick="toggleMenu()"
    >
      ☰
    </div>

    <nav id="navMenu">

      <a href="/">
        Home
      </a>

      <a href="#products">
        Products
      </a>

      <a href="/upload.html">
        Admin
      </a>

      <a
        href="https://instagram.com/shopper.s.suggestions"
        target="_blank"
        rel="noopener"
      >
        Instagram
      </a>

    </nav>

  </div>

</header>


<main>

<!-- HERO -->

<section class="hero">

  <h1>
    Shopper's Suggestions
  </h1>

  <p>
    Discover useful products that solve real everyday problems.
  </p>


  <!-- SEARCH -->

  <div class="search-wrap">

    <input
      id="search"
      type="search"
      placeholder="Search products..."
      oninput="filterProducts()"
    >

    <select
      id="category"
      onchange="filterProducts()"
    >

      <option value="">
        All Categories
      </option>

      <option>Tech</option>
      <option>Home</option>
      <option>Fashion</option>
      <option>Beauty</option>
      <option>Gaming</option>
      <option>Sports</option>
      <option>Travel</option>
      <option>Kitchen</option>
      <option>Office</option>
      <option>Automotive</option>
      <option>Electronics</option>
      <option>Kids</option>
      <option>Pets</option>
      <option>Fitness</option>
      <option>Books</option>
      <option>Accessories</option>
      <option>Photography</option>
      <option>Creator</option>
      <option>Other</option>

    </select>

  </div>

</section>


<!-- PRODUCTS -->

<section
  class="products"
  id="products"
>

  <div class="section-head">

    <h2>
      Latest Suggestions
    </h2>

    <span id="count"></span>

  </div>


  <div id="status">
    Loading products...
  </div>


  <div
    id="productGrid"
    class="grid"
  ></div>

</section>

</main>


<footer>

  <strong>
    Shopper's Suggestions
  </strong>

  <br>

  Useful finds. Real problems. Smarter shopping.

</footer>


<script>

let allProducts = [];


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(){

  document
    .getElementById("navMenu")
    .classList
    .toggle("open");

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const response =
      await fetch("/api/products");

    if(!response.ok){
      throw new Error("API error");
    }

    const data =
      await response.json();

    allProducts =
      Array.isArray(data)
        ? data
        : (data.products || []);

    document
      .getElementById("status")
      .style
      .display = "none";

    renderProducts(allProducts);

  }catch(error){

    console.error(error);

    document
      .getElementById("status")
      .innerHTML =
        "Unable to load products right now.";

  }

}


/* =========================
   SEARCH + CATEGORY
========================= */

function filterProducts(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const c =
    document
      .getElementById("category")
      .value
      .toLowerCase();


  const filtered =
    allProducts.filter(product => {

      const title =
        String(product.title || "")
          .toLowerCase();

      const description =
        String(product.description || "")
          .toLowerCase();

      const category =
        String(product.category || "")
          .toLowerCase();


      return (

        (!q ||
          title.includes(q) ||
          description.includes(q) ||
          category.includes(q))

        &&

        (!c ||
          category === c)

      );

    });


  renderProducts(filtered);

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products){

  const grid =
    document.getElementById(
      "productGrid"
    );


  document.getElementById("count")
    .textContent =
      products.length +
      " suggestion" +
      (products.length === 1 ? "" : "s");


  if(!products.length){

    grid.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  grid.innerHTML =
    products.map((product,index)=>{


      /*
       * SUPPORT ALL FIVE IMAGE
       * DATABASE FIELDS
       */

      let images = [

        product.image1_url,
        product.image2_url,
        product.image3_url,
        product.image4_url,
        product.image5_url

      ].filter(
        x =>
          typeof x === "string" &&
          x.trim()
      );


      /*
       * ALSO SUPPORT
       * product.images[]
       */

      if(Array.isArray(product.images)){

        product.images.forEach(image=>{

          if(
            image &&
            !images.includes(image)
          ){

            images.push(image);

          }

        });

      }


      /*
       * FALLBACK
       */

      if(!images.length){

        images = [
          "https://via.placeholder.com/800x800?text=No+Image"
        ];

      }


      const galleryId =
        "gallery-" +
        product.id +
        "-" +
        index;


      /*
       * IMAGE SLIDES
       */

      const slides =
        images.map(url=>`

          <div class="gallery-slide">

            <img
              src="${escapeHTML(url)}"
              alt="${escapeHTML(
                product.title ||
                "Product"
              )}"
              loading="lazy"
            >

          </div>

        `).join("");


      /*
       * DOTS
       */

      const dots =
        images.map((_,i)=>`

          <span
            class="dot ${i === 0 ? "active" : ""}"
          ></span>

        `).join("");


      /*
       * VIDEO
       */

      const video =
        product.video_url

        ?

        `
        <div class="video">

          <video
            controls
            preload="metadata"
            src="${escapeHTML(
              product.video_url
            )}"
          ></video>

        </div>
        `

        :

        "";


      return `

      <article
        class="card"
        style="animation-delay:${Math.min(
          index * 70,
          700
        )}ms"
      >


        <!-- GALLERY -->

        <div
          class="gallery"
          id="${galleryId}"
          data-index="0"
          data-count="${images.length}"
        >

          <div class="gallery-track">

            ${slides}

          </div>


          ${
            images.length > 1

            ?

            `

            <button
              class="arrow left"
              onclick="changeSlide(
                '${galleryId}',
                -1
              )"
              aria-label="Previous image"
            >
              ‹
            </button>


            <button
              class="arrow right"
              onclick="changeSlide(
                '${galleryId}',
                1
              )"
              aria-label="Next image"
            >
              ›
            </button>


            <div class="dots">

              ${dots}

            </div>


            <div class="counter">

              <span class="current">
                1
              </span>

              /
              ${images.length}

            </div>

            `

            :

            ""

          }

        </div>


        <!-- CONTENT -->

        <div class="content">


          ${
            product.category

            ?

            `
            <div class="category">

              ${escapeHTML(
                product.category
              )}

            </div>
            `

            :

            ""

          }


          <h2 class="title">

            ${escapeHTML(
              product.title || ""
            )}

          </h2>


          <!-- FULL DESCRIPTION -->

          <div class="description">

            ${escapeHTML(
              product.description || ""
            )}

          </div>


          ${video}


          ${
            product.affiliate_url

            ?

            `
            <a
              class="buy"
              href="${escapeHTML(
                product.affiliate_url
              )}"
              target="_blank"
              rel="noopener noreferrer sponsored"
            >

              MAKE IT YOURS!

            </a>
            `

            :

            ""

          }

        </div>

      </article>

      `;

    }).join("");


  setupSwipe();

}


/* =========================
   IMAGE SLIDER
========================= */

function changeSlide(
  galleryId,
  direction
){

  const gallery =
    document.getElementById(
      galleryId
    );

  if(!gallery)return;


  const track =
    gallery.querySelector(
      ".gallery-track"
    );

  const dots =
    gallery.querySelectorAll(
      ".dot"
    );

  const current =
    gallery.querySelector(
      ".current"
    );


  const count =
    Number(
      gallery.dataset.count
    );


  let index =
    Number(
      gallery.dataset.index
    ) +
    direction;


  if(index < 0){

    index = count - 1;

  }


  if(index >= count){

    index = 0;

  }


  gallery.dataset.index =
    index;


  track.style.transform =
    `translateX(-${index * 100}%)`;


  dots.forEach(
    (dot,i)=>{

      dot.classList.toggle(
        "active",
        i === index
      );

    }
  );


  if(current){

    current.textContent =
      index + 1;

  }

}


/* =========================
   MOBILE SWIPE
========================= */

function setupSwipe(){

  document
    .querySelectorAll(".gallery")
    .forEach(gallery=>{

      let startX = 0;
      let startY = 0;


      gallery.addEventListener(
        "touchstart",
        event=>{

          startX =
            event.touches[0].clientX;

          startY =
            event.touches[0].clientY;

        },
        {
          passive:true
        }
      );


      gallery.addEventListener(
        "touchend",
        event=>{

          const dx =
            event.changedTouches[0]
              .clientX -
            startX;

          const dy =
            event.changedTouches[0]
              .clientY -
            startY;


          if(
            Math.abs(dx) > 45 &&
            Math.abs(dx) >
              Math.abs(dy)
          ){

            changeSlide(
              gallery.id,
              dx < 0 ? 1 : -1
            );

          }

        },
        {
          passive:true
        }
      );

    });

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
