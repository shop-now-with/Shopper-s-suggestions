<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Shopper's Suggestions — Maintenance</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#162238 0%,#080c14 45%,#030509 100%);
  color:white;
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:30px 18px 45px;
}

/* BRAND */

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:72px;
  height:72px;
  object-fit:contain;
  border-radius:20px;
  background:white;
  margin-bottom:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.brand-name{
  font-size:clamp(25px,5vw,42px);
  font-weight:900;
  letter-spacing:-1.5px;
  background:linear-gradient(100deg,#ff6a00,#ff9b35,#2b78ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:7px 13px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  border-radius:50px;
  font-size:12px;
  color:#aeb8c8;
}

.status-dot{
  width:7px;
  height:7px;
  background:#ff8a00;
  border-radius:50%;
  box-shadow:0 0 14px #ff8a00;
}

/* MAINTENANCE */

.message{
  text-align:center;
  max-width:650px;
  margin:0 auto 28px;
}

.message h1{
  font-size:clamp(25px,6vw,46px);
  letter-spacing:-1.5px;
  margin-bottom:10px;
}

.message p{
  color:#8995a8;
  line-height:1.6;
  font-size:15px;
}

/* GAME */

.game-card{
  width:100%;
  max-width:850px;
  margin:auto;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(10,15,25,.8);
  border-radius:28px;
  overflow:hidden;
  box-shadow:
    0 30px 90px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.05);
}

.game-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.game-title{
  font-weight:800;
  font-size:14px;
  letter-spacing:.5px;
}

.scores{
  display:flex;
  gap:16px;
  font-size:12px;
  color:#8d99aa;
}

.score strong,
.high strong{
  color:white;
  margin-left:4px;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#07101c;
  touch-action:none;
}

.game-bottom{
  padding:16px;
  text-align:center;
}

.game-hint{
  color:#778397;
  font-size:12px;
  margin-bottom:12px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.start-btn{
  min-height:46px;
  padding:0 24px;
  border-radius:14px;
  color:white;
  font-weight:800;
  background:linear-gradient(100deg,#ff6a00,#ff8a00);
  box-shadow:0 8px 25px rgba(255,106,0,.25);
  transition:.2s;
}

.start-btn:hover{
  transform:translateY(-2px);
}

.mobile-controls{
  display:flex;
  justify-content:center;
  margin-top:12px;
}

.jump-btn{
  width:100%;
  max-width:260px;
  min-height:48px;
  border-radius:14px;
  background:#151d2a;
  color:white;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#596577;
  font-size:12px;
  margin-top:25px;
}

@media(max-width:600px){

  .page{
    padding:22px 12px 35px;
  }

  .game-card{
    border-radius:22px;
  }

  .game-top{
    padding:13px 15px;
  }

  .scores{
    gap:8px;
  }

  .message{
    margin-bottom:22px;
  }

}
</style>
</head>

<body>

<div class="page">

  <div class="brand">

    <img
      class="logo"
      src="2E7A6582-42BB-48D4-84D8-71C3DA3ED841.jpeg"
      alt="Shopper's Suggestions logo"
    >

    <div class="brand-name">
      Shopper's Suggestions
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Temporarily under maintenance
    </div>

  </div>


  <div class="message">

    <h1>
      Something better is loading.
    </h1>

    <p>
      We're making a few improvements behind the scenes.
      While you wait, try to beat the highest score.
    </p>

  </div>


  <section class="game-card">

    <div class="game-top">

      <div class="game-title">
        SHOPPER RUN
      </div>

      <div class="scores">

        <div class="score">
          SCORE
          <strong id="score">0</strong>
        </div>

        <div class="high">
          BEST
          <strong id="highScore">0</strong>
        </div>

      </div>

    </div>


    <canvas id="game" width="900" height="360"></canvas>


    <div class="game-bottom">

      <div class="game-hint" id="hint">
        Tap the game or press SPACE to jump
      </div>

      <button
        class="start-btn"
        id="startBtn"
        type="button"
      >
        START RUN
      </button>

      <div class="mobile-controls">

        <button
          class="jump-btn"
          id="jumpBtn"
          type="button"
        >
          TAP TO JUMP
        </button>

      </div>

    </div>

  </section>


  <div class="footer">
    Shopper's Suggestions · We'll be back soon
  </div>

</div>


<script>
(() => {

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const highScoreEl = document.getElementById("highScore");
  const startBtn = document.getElementById("startBtn");
  const jumpBtn = document.getElementById("jumpBtn");
  const hint = document.getElementById("hint");

  let highScore = Number(
    localStorage.getItem("shopperRunHighScore") || 0
  );

  highScoreEl.textContent = highScore;

  let running = false;
  let gameOver = false;
  let animation = 0;

  let score = 0;
  let speed = 5;

  let obstacleTimer = 0;
  let coinTimer = 0;

  let lastTime = 0;

  const ground = 300;

  const player = {
    x: 100,
    y: ground - 52,
    width: 42,
    height: 52,
    velocityY: 0,
    jumping: false
  };

  const obstacles = [];
  const coins = [];
  const particles = [];


  function resetGame(){

    score = 0;
    speed = 5;

    obstacleTimer = 0;
    coinTimer = 0;

    obstacles.length = 0;
    coins.length = 0;
    particles.length = 0;

    player.y = ground - player.height;
    player.velocityY = 0;
    player.jumping = false;

    gameOver = false;

    scoreEl.textContent = "0";

    hint.textContent =
      "Tap the game or press SPACE to jump";

  }


  function startGame(){

    if(running) return;

    resetGame();

    running = true;

    startBtn.textContent = "RUNNING...";

    lastTime = performance.now();

    cancelAnimationFrame(animation);

    animation = requestAnimationFrame(loop);
  }


  function endGame(){

    running = false;
    gameOver = true;

    const finalScore = Math.floor(score);

    if(finalScore > highScore){

      highScore = finalScore;

      localStorage.setItem(
        "shopperRunHighScore",
        highScore
      );

      highScoreEl.textContent = highScore;

      hint.textContent =
        "NEW HIGH SCORE! Tap START RUN to play again.";

    }else{

      hint.textContent =
        "Game over — tap START RUN to try again.";

    }

    startBtn.textContent = "PLAY AGAIN";
  }


  function jump(){

    if(!running){

      startGame();

      return;
    }

    if(!player.jumping){

      player.velocityY = -13;

      player.jumping = true;

      createParticles(
        player.x + 20,
        player.y + player.height
      );
    }
  }


  function createParticles(x,y){

    for(let i=0;i<7;i++){

      particles.push({

        x,
        y,

        vx:(Math.random()-.5)*3,

        vy:-Math.random()*2,

        life:25

      });

    }

  }


  function spawnObstacle(){

    const height =
      25 + Math.random()*45;

    const width =
      20 + Math.random()*28;

    obstacles.push({

      x:canvas.width + 20,

      y:ground-height,

      width,

      height

    });

  }


  function spawnCoin(){

    coins.push({

      x:canvas.width + 20,

      y:120 + Math.random()*130,

      radius:9,

      rotation:0

    });

  }


  function collision(a,b){

    return (

      a.x < b.x + b.width &&

      a.x + a.width > b.x &&

      a.y < b.y + b.height &&

      a.y + a.height > b.y

    );

  }


  function coinCollision(player,coin){

    const closestX =
      Math.max(
        player.x,
        Math.min(
          coin.x,
          player.x + player.width
        )
      );

    const closestY =
      Math.max(
        player.y,
        Math.min(
          coin.y,
          player.y + player.height
        )
      );

    const dx =
      coin.x - closestX;

    const dy =
      coin.y - closestY;

    return (
      dx*dx +
      dy*dy <
      coin.radius*coin.radius
    );

  }


  function update(dt){

    score += dt * 0.01;

    speed += dt * 0.00035;

    scoreEl.textContent =
      Math.floor(score);


    /* PLAYER */

    player.velocityY += 0.65 * dt / 16;

    player.y +=
      player.velocityY * dt / 16;

    if(player.y >= ground-player.height){

      player.y =
        ground-player.height;

      player.velocityY = 0;

      player.jumping = false;
    }


    /* OBSTACLES */

    obstacleTimer += dt;

    const obstacleDelay =
      Math.max(
        650,
        1450 - speed*55
      );

    if(obstacleTimer > obstacleDelay){

      spawnObstacle();

      obstacleTimer = 0;
    }


    for(let i=obstacles.length-1;i>=0;i--){

      const obstacle =
        obstacles[i];

      obstacle.x -=
        speed * dt / 16;

      if(
        collision(player,obstacle)
      ){

        endGame();

        return;
      }

      if(
        obstacle.x +
        obstacle.width <
        -20
      ){

        obstacles.splice(i,1);

        score += 5;
      }

    }


    /* COINS */

    coinTimer += dt;

    if(coinTimer > 900){

      spawnCoin();

      coinTimer = 0;
    }


    for(let i=coins.length-1;i>=0;i--){

      const coin =
        coins[i];

      coin.x -=
        speed * dt / 16;

      coin.rotation +=
        dt * 0.006;

      if(
        coinCollision(
          player,
          coin
        )
      ){

        score += 25;

        createParticles(
          coin.x,
          coin.y
        );

        coins.splice(i,1);

        continue;
      }

      if(
        coin.x < -30
      ){

        coins.splice(i,1);
      }

    }


    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

      const p =
        particles[i];

      p.x +=
        p.vx * dt/16;

      p.y +=
        p.vy * dt/16;

      p.vy +=
        .08 * dt/16;

      p.life -=
        dt/16;

      if(p.life <= 0){

        particles.splice(i,1);
      }

    }

  }


  function drawBackground(){

    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        0,
        canvas.height
      );

    gradient.addColorStop(
      0,
      "#091423"
    );

    gradient.addColorStop(
      1,
      "#03070c"
    );

    ctx.fillStyle =
      gradient;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* STARS */

    ctx.fillStyle =
      "rgba(255,255,255,.35)";

    for(let i=0;i<45;i++){

      const x =
        (i*173)%canvas.width;

      const y =
        (i*67)%230;

      ctx.fillRect(
        x,
        y,
        2,
        2
      );

    }


    /* CITY */

    ctx.fillStyle =
      "#0c1725";

    for(let i=0;i<18;i++){

      const x =
        i*55;

      const h =
        35+(i*19)%80;

      ctx.fillRect(
        x,
        ground-h,
        42,
        h
      );

      ctx.fillStyle =
        "rgba(255,140,40,.18)";

      for(let w=0;w<3;w++){

        ctx.fillRect(
          x+8+w*10,
          ground-h+12,
          4,
          6
        );

      }

      ctx.fillStyle =
        "#0c1725";

    }


    /* GROUND */

    ctx.fillStyle =
      "#111c2b";

    ctx.fillRect(
      0,
      ground,
      canvas.width,
      canvas.height-ground
    );

    ctx.fillStyle =
      "#ff7200";

    ctx.fillRect(
      0,
      ground,
      canvas.width,
      2
    );


    /* ROAD LINES */

    ctx.strokeStyle =
      "rgba(255,255,255,.06)";

    ctx.lineWidth = 2;

    const offset =
      (performance.now()/8)%80;

    for(
      let x=-80+offset;
      x<canvas.width;
      x+=80
    ){

      ctx.beginPath();

      ctx.moveTo(
        x,
        ground+35
      );

      ctx.lineTo(
        x+35,
        ground+35
      );

      ctx.stroke();

    }

  }


  function drawPlayer(){

    ctx.save();

    ctx.translate(
      player.x,
      player.y
    );


    /* SHADOW */

    ctx.fillStyle =
      "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
      21,
      54,
      22,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* BODY */

    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        42,
        52
      );

    gradient.addColorStop(
      0,
      "#ff9b32"
    );

    gradient.addColorStop(
      1,
      "#ff5a00"
    );

    ctx.fillStyle =
      gradient;

    ctx.beginPath();

    ctx.roundRect(
      5,
      10,
      32,
      35,
      9
    );

    ctx.fill();


    /* HEAD */

    ctx.fillStyle =
      "#f5f7fa";

    ctx.beginPath();

    ctx.arc(
      21,
      7,
      10,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* EYE */

    ctx.fillStyle =
      "#07101c";

    ctx.beginPath();

    ctx.arc(
      24,
      5,
      2,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* LEGS */

    ctx.strokeStyle =
      "#f5f7fa";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    const runningOffset =
      Math.sin(
        performance.now()/80
      ) * 4;

    ctx.beginPath();

    ctx.moveTo(
      14,
      43
    );

    ctx.lineTo(
      10-runningOffset,
      51
    );

    ctx.moveTo(
      28,
      43
    );

    ctx.lineTo(
      33+runningOffset,
      51
    );

    ctx.stroke();


    ctx.restore();

  }


  function drawObstacles(){

    obstacles.forEach(o=>{

      const gradient =
        ctx.createLinearGradient(
          o.x,
          o.y,
          o.x+o.width,
          o.y+o.height
        );

      gradient.addColorStop(
        0,
        "#ff8b24"
      );

      gradient.addColorStop(
        1,
        "#d83d00"
      );

      ctx.fillStyle =
        gradient;

      ctx.beginPath();

      ctx.roundRect(
        o.x,
        o.y,
        o.width,
        o.height,
        6
      );

      ctx.fill();


      ctx.fillStyle =
        "rgba(255,255,255,.2)";

      ctx.fillRect(
        o.x+5,
        o.y+6,
        o.width-10,
        3
      );

    });

  }


  function drawCoins(){

    coins.forEach(c=>{

      ctx.save();

      ctx.translate(
        c.x,
        c.y
      );

      ctx.rotate(
        c.rotation
      );

      ctx.fillStyle =
        "#ffd45a";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        c.radius,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle =
        "#9b6200";

      ctx.font =
        "bold 11px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillText(
        "$",
        0,
        1
      );

      ctx.restore();

    });

  }


  function drawParticles(){

    particles.forEach(p=>{

      ctx.globalAlpha =
        Math.max(
          0,
          p.life/25
        );

      ctx.fillStyle =
        "#ff8a00";

      ctx.fillRect(
        p.x,
        p.y,
        4,
        4
      );

      ctx.globalAlpha = 1;

    });

  }


  function drawGameOver(){

    if(!gameOver) return;

    ctx.fillStyle =
      "rgba(3,7,12,.72)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.textAlign =
      "center";

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "900 34px Arial";

    ctx.fillText(
      "RUN OVER",
      canvas.width/2,
      145
    );

    ctx.font =
      "600 17px Arial";

    ctx.fillStyle =
      "#ff8a00";

    ctx.fillText(
      "Score: " + Math.floor(score),
      canvas.width/2,
      180
    );

    ctx.font =
      "14px Arial";

    ctx.fillStyle =
      "#aeb8c8";

    ctx.fillText(
      "Press PLAY AGAIN",
      canvas.width/2,
      215
    );

  }


  function draw(){

    drawBackground();

    drawCoins();

    drawObstacles();

    drawPlayer();

    drawParticles();

    drawGameOver();

  }


  function loop(time){

    if(!running){

      draw();

      return;
    }

    const dt =
      Math.min(
        32,
        time-lastTime
      );

    lastTime = time;

    update(dt);

    draw();

    if(running){

      animation =
        requestAnimationFrame(
          loop
        );

    }

  }


  startBtn.addEventListener(
    "click",
    startGame
  );


  jumpBtn.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      jump();
    }
  );


  canvas.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      jump();
    }
  );


  document.addEventListener(
    "keydown",
    e=>{

      if(
        e.code === "Space" ||
        e.code === "ArrowUp"
      ){

        e.preventDefault();

        jump();

      }

    }
  );


  resetGame();

  draw();

})();
</script>

</body>
</html>
