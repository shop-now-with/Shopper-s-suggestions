<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopper's Suggestions — Upload</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f8fa;
  color:#111827;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:18px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:10px;
  background:#fff;
}

.brand span{
  background:linear-gradient(90deg,#ff7a00,#123d91);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

main{
  width:min(900px,calc(100% - 30px));
  margin:40px auto 80px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:22px;
  padding:28px;
  box-shadow:0 15px 40px rgba(0,0,0,.05);
}

h1{
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:20px 0 8px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:14px;
  font:inherit;
  outline:none;
  background:#fff;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
  min-height:130px;
  resize:vertical;
}

.images{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

button{
  border:0;
  border-radius:13px;
  padding:14px 20px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.login-btn{
  background:#111827;
  color:#fff;
  width:100%;
  margin-top:20px;
}

.publish-btn{
  background:linear-gradient(90deg,#ff7a00,#123d91);
  color:#fff;
  width:100%;
  margin-top:28px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px 15px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
}

.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
}

.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
}

.admin-panel{
  display:none;
}

.login-panel{
  max-width:460px;
  margin:0 auto;
}

.preview{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.preview img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #e5e7eb;
  display:none;
}

@media(max-width:600px){
  header{
    padding:14px 16px;
  }

  main{
    width:calc(100% - 20px);
    margin-top:20px;
  }

  .card{
    padding:20px;
    border-radius:18px;
  }

  h1{
    font-size:25px;
  }

  .images{
    grid-template-columns:1fr;
  }

  .preview{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="2E7A6582-42BB-48D4-84D8-71C3DA3ED841.jpeg" alt="Logo">
    <span>Shopper's Suggestions</span>
  </div>
</header>

<main>

  <section class="card login-panel" id="loginPanel">
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to publish products.</p>

    <label for="password">Admin Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter admin password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">
      Continue
    </button>

    <div class="message" id="loginMessage"></div>
  </section>


  <section class="card admin-panel" id="adminPanel">

    <h1>Add Product</h1>
    <p class="subtitle">
      Add a product to Shopper's Suggestions.
    </p>

    <label for="title">Product Title</label>
    <input
      id="title"
      type="text"
      maxlength="200"
      placeholder="Example: Wireless Bluetooth Headphones"
    >

    <label for="description">Description</label>
    <textarea
      id="description"
      maxlength="5000"
      placeholder="Write a useful description of the product..."
    ></textarea>

    <label for="affiliate">Affiliate Link</label>
    <input
      id="affiliate"
      type="url"
      placeholder="https://example.com/product"
    >

    <label for="category">Category</label>
    <select id="category">
      <option value="Tech">Tech</option>
      <option value="Home">Home</option>
      <option value="Fashion">Fashion</option>
      <option value="Beauty">Beauty</option>
      <option value="Gaming">Gaming</option>
      <option value="Sports">Sports</option>
      <option value="Travel">Travel</option>
      <option value="Kitchen">Kitchen</option>
      <option value="Office">Office</option>
      <option value="Automotive">Automotive</option>
      <option value="Electronics">Electronics</option>
      <option value="Kids">Kids</option>
      <option value="Pets">Pets</option>
      <option value="Fitness">Fitness</option>
      <option value="Books">Books</option>
      <option value="Accessories">Accessories</option>
      <option value="Photography">Photography</option>
      <option value="Creator">Creator</option>
      <option value="Other">Other</option>
    </select>

    <label>Image Links — up to 5</label>

    <div class="images">
      <input class="image-input" type="url" placeholder="Image URL 1">
      <input class="image-input" type="url" placeholder="Image URL 2">
      <input class="image-input" type="url" placeholder="Image URL 3">
      <input class="image-input" type="url" placeholder="Image URL 4">
      <input class="image-input" type="url" placeholder="Image URL 5">
    </div>

    <div class="preview">
      <img id="preview1">
      <img id="preview2">
      <img id="preview3">
      <img id="preview4">
      <img id="preview5">
    </div>

    <button class="publish-btn" id="publishBtn">
      PUBLISH PRODUCT
    </button>

    <div class="message" id="productMessage"></div>

  </section>

</main>

<script>
const API = "/api";
let adminPassword = "";

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");

const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");

const publishBtn = document.getElementById("publishBtn");
const productMessage = document.getElementById("productMessage");

function showMessage(element, text, type){
  element.textContent = text;
  element.className = "message " + type;
}

loginBtn.addEventListener("click", async () => {

  const password = passwordInput.value.trim();

  if(!password){
    showMessage(loginMessage,"Enter your admin password.","error");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Checking...";

  try{

    const response = await fetch(`${API}/products`,{
      method:"GET",
      headers:{
        "Authorization":`Bearer ${password}`
      }
    });

    const data = await response.json();

    if(response.status === 401){
      throw new Error(data.error || "Incorrect password.");
    }

    if(!response.ok){
      throw new Error(data.error || "Unable to connect.");
    }

    adminPassword = password;

    loginPanel.style.display = "none";
    adminPanel.style.display = "block";

  }catch(error){

    showMessage(
      loginMessage,
      error.message || "Login failed.",
      "error"
    );

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Continue";

  }

});


document.querySelectorAll(".image-input").forEach((input,index)=>{

  input.addEventListener("input",()=>{

    const preview = document.getElementById(`preview${index+1}`);
    const url = input.value.trim();

    if(!url){
      preview.style.display = "none";
      preview.removeAttribute("src");
      return;
    }

    preview.src = url;
    preview.style.display = "block";

    preview.onerror = ()=>{
      preview.style.display = "none";
    };

  });

});


publishBtn.addEventListener("click", async ()=>{

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const affiliate = document.getElementById("affiliate").value.trim();
  const selectedCategory = document.getElementById("category").value;

  const images = Array.from(
    document.querySelectorAll(".image-input")
  )
  .map(input => input.value.trim())
  .filter(Boolean)
  .slice(0,5);

  if(!title){
    showMessage(productMessage,"Please enter a product title.","error");
    return;
  }

  if(!affiliate){
    showMessage(productMessage,"Please enter the affiliate link.","error");
    return;
  }

  publishBtn.disabled = true;
  publishBtn.textContent = "PUBLISHING...";

  try{

    const response = await fetch(`${API}/products`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${adminPassword}`
      },
      body:JSON.stringify({
        title,
        description,
        affiliate_url:affiliate,
        category:selectedCategory,
        images
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Unable to publish product.");
    }

    showMessage(
      productMessage,
      "Product published successfully.",
      "success"
    );

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("affiliate").value = "";
    document.getElementById("category").value = "Tech";

    document.querySelectorAll(".image-input").forEach(input=>{
      input.value = "";
    });

    document.querySelectorAll(".preview img").forEach(img=>{
      img.style.display = "none";
      img.removeAttribute("src");
    });

  }catch(error){

    showMessage(
      productMessage,
      error.message || "Publishing failed.",
      "error"
    );

  }finally{

    publishBtn.disabled = false;
    publishBtn.textContent = "PUBLISH PRODUCT";

  }

});
</script>

</body>
</html>
