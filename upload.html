<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopper's Suggestions — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f8fa;
  color:#111827;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  font-size:18px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:10px;
}

.brand span{
  background:linear-gradient(90deg,#ff7a00,#123d91);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

main{
  width:min(950px,calc(100% - 24px));
  margin:30px auto 70px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:22px;
  padding:26px;
  box-shadow:0 15px 40px rgba(0,0,0,.05);
  margin-bottom:22px;
}

h1{
  font-size:29px;
  margin-bottom:7px;
}

h2{
  font-size:22px;
  margin-bottom:7px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:19px 0 8px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:14px;
  font:inherit;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
  min-height:130px;
  resize:vertical;
}

.images{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.login-btn{
  width:100%;
  background:#111827;
  color:#fff;
  margin-top:20px;
}

.publish-btn{
  width:100%;
  background:linear-gradient(90deg,#ff7a00,#123d91);
  color:#fff;
  margin-top:27px;
}

.refresh-btn{
  background:#111827;
  color:#fff;
}

.delete-btn{
  background:#ef4444;
  color:#fff;
  width:100%;
  margin-top:12px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:17px;
  padding:13px 15px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
}

.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
}

.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
}

.login-panel{
  max-width:460px;
  margin:35px auto;
}

.admin-panel{
  display:none;
}

.manage-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.products{
  display:grid;
  gap:14px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product-image{
  width:90px;
  height:90px;
  flex-shrink:0;
  border-radius:13px;
  object-fit:cover;
  background:#f3f4f6;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.product-category{
  color:#6b7280;
  font-size:13px;
}

.product-id{
  color:#9ca3af;
  font-size:12px;
  margin-top:5px;
}

.empty{
  text-align:center;
  padding:30px 15px;
  color:#6b7280;
  border:1px dashed #d1d5db;
  border-radius:15px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:10px;
}

.preview img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #e5e7eb;
  display:none;
}

@media(max-width:650px){
  .images{
    grid-template-columns:1fr;
  }

  .preview{
    grid-template-columns:repeat(3,1fr);
  }

  .product{
    align-items:flex-start;
  }

  .product-image{
    width:72px;
    height:72px;
  }

  .manage-header{
    align-items:flex-start;
  }

  .refresh-btn{
    padding:11px 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img
      src="2E7A6582-42BB-48D4-84D8-71C3DA3ED841.jpeg"
      alt="Logo"
    >
    <span>Shopper's Suggestions</span>
  </div>
</header>

<main>

<section class="card login-panel" id="loginPanel">

  <h1>Admin Login</h1>
  <p class="subtitle">
    Sign in to manage your products.
  </p>

  <label for="password">Admin Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter admin password"
    autocomplete="current-password"
  >

  <button class="login-btn" id="loginBtn">
    Continue
  </button>

  <div class="message" id="loginMessage"></div>

</section>


<section class="admin-panel" id="adminPanel">

  <section class="card">

    <h1>Add Product</h1>

    <p class="subtitle">
      Add a new product to Shopper's Suggestions.
    </p>

    <label for="title">Product Title</label>

    <input
      id="title"
      type="text"
      maxlength="200"
      placeholder="Example: Wireless Bluetooth Headphones"
    >

    <label for="description">Description</label>

    <textarea
      id="description"
      maxlength="5000"
      placeholder="Write a useful description..."
    ></textarea>

    <label for="affiliate">Affiliate Link</label>

    <input
      id="affiliate"
      type="url"
      placeholder="https://example.com/product"
    >

    <label for="category">Category</label>

    <select id="category">
      <option value="Tech">Tech</option>
      <option value="Home">Home</option>
      <option value="Fashion">Fashion</option>
      <option value="Beauty">Beauty</option>
      <option value="Gaming">Gaming</option>
      <option value="Sports">Sports</option>
      <option value="Travel">Travel</option>
      <option value="Kitchen">Kitchen</option>
      <option value="Office">Office</option>
      <option value="Automotive">Automotive</option>
      <option value="Electronics">Electronics</option>
      <option value="Kids">Kids</option>
      <option value="Pets">Pets</option>
      <option value="Fitness">Fitness</option>
      <option value="Books">Books</option>
      <option value="Accessories">Accessories</option>
      <option value="Photography">Photography</option>
      <option value="Creator">Creator</option>
      <option value="Other">Other</option>
    </select>

    <label>Image Links — up to 5</label>

    <div class="images">

      <input
        class="image-input"
        type="url"
        placeholder="Image URL 1"
      >

      <input
        class="image-input"
        type="url"
        placeholder="Image URL 2"
      >

      <input
        class="image-input"
        type="url"
        placeholder="Image URL 3"
      >

      <input
        class="image-input"
        type="url"
        placeholder="Image URL 4"
      >

      <input
        class="image-input"
        type="url"
        placeholder="Image URL 5"
      >

    </div>

    <div class="preview">
      <img id="preview1">
      <img id="preview2">
      <img id="preview3">
      <img id="preview4">
      <img id="preview5">
    </div>

    <button
      class="publish-btn"
      id="publishBtn"
    >
      PUBLISH PRODUCT
    </button>

    <div
      class="message"
      id="productMessage"
    ></div>

  </section>


  <section class="card">

    <div class="manage-header">

      <div>
        <h2>Manage Products</h2>
        <p class="subtitle" style="margin-bottom:0">
          View and delete published products.
        </p>
      </div>

      <button
        class="refresh-btn"
        id="refreshBtn"
      >
        Refresh
      </button>

    </div>

    <div
      class="products"
      id="products"
    >
      <div class="empty">
        Loading products...
      </div>
    </div>

  </section>

</section>

</main>

<script>
const API = "/api";

let adminPassword = "";

const loginPanel =
  document.getElementById("loginPanel");

const adminPanel =
  document.getElementById("adminPanel");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginMessage =
  document.getElementById("loginMessage");

const publishBtn =
  document.getElementById("publishBtn");

const productMessage =
  document.getElementById("productMessage");

const productsContainer =
  document.getElementById("products");

const refreshBtn =
  document.getElementById("refreshBtn");


function showMessage(element,text,type){

  element.textContent = text;
  element.className = "message " + type;

}


async function login(){

  const password =
    passwordInput.value.trim();

  if(!password){

    showMessage(
      loginMessage,
      "Enter your admin password.",
      "error"
    );

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Checking...";

  try{

    const response =
      await fetch(`${API}/products`,{
        headers:{
          "Authorization":
            `Bearer ${password}`
        }
      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Login failed."
      );

    }

    adminPassword = password;

    loginPanel.style.display = "none";
    adminPanel.style.display = "block";

    renderProducts(data.products || []);

  }catch(error){

    showMessage(
      loginMessage,
      error.message || "Login failed.",
      "error"
    );

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Continue";

  }

}


loginBtn.addEventListener("click",login);


passwordInput.addEventListener("keydown",(event)=>{

  if(event.key === "Enter"){
    login();
  }

});


async function loadProducts(){

  productsContainer.innerHTML =
    `<div class="empty">Loading products...</div>`;

  try{

    const response =
      await fetch(`${API}/products`,{
        headers:{
          "Authorization":
            `Bearer ${adminPassword}`
        }
      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Unable to load products."
      );

    }

    renderProducts(data.products || []);

  }catch(error){

    productsContainer.innerHTML =
      `<div class="empty">${escapeHtml(
        error.message
      )}</div>`;

  }

}


function renderProducts(products){

  if(!products.length){

    productsContainer.innerHTML =
      `<div class="empty">
        No products have been added yet.
      </div>`;

    return;
  }

  productsContainer.innerHTML =
    products.map(product => {

      const image =
        product.images &&
        product.images.length
          ? product.images[0]
          : "";

      return `
        <div class="product">

          ${
            image
              ? `<img
                  class="product-image"
                  src="${escapeAttribute(image)}"
                  alt=""
                  onerror="this.style.display='none'"
                >`
              : `<div class="product-image"></div>`
          }

          <div class="product-info">

            <div class="product-title">
              ${escapeHtml(product.title)}
            </div>

            <div class="product-category">
              ${escapeHtml(product.category)}
            </div>

            <div class="product-id">
              Product ID: ${product.id}
            </div>

            <button
              class="delete-btn"
              onclick="deleteProduct(${product.id})"
            >
              DELETE PRODUCT
            </button>

          </div>

        </div>
      `;

    }).join("");

}


async function deleteProduct(id){

  const confirmed =
    confirm(
      "Are you sure you want to permanently delete this product?"
    );

  if(!confirmed){
    return;
  }

  try{

    const response =
      await fetch(
        `${API}/products/${id}`,
        {
          method:"DELETE",
          headers:{
            "Authorization":
              `Bearer ${adminPassword}`
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Delete failed."
      );

    }

    await loadProducts();

  }catch(error){

    alert(
      error.message || "Unable to delete product."
    );

  }

}


refreshBtn.addEventListener(
  "click",
  loadProducts
);


publishBtn.addEventListener(
  "click",
  async ()=>{

    const title =
      document.getElementById("title")
        .value.trim();

    const description =
      document.getElementById("description")
        .value.trim();

    const affiliate =
      document.getElementById("affiliate")
        .value.trim();

    const selectedCategory =
      document.getElementById("category")
        .value;

    const images =
      Array.from(
        document.querySelectorAll(
          ".image-input"
        )
      )
      .map(input => input.value.trim())
      .filter(Boolean)
      .slice(0,5);

    if(!title){

      showMessage(
        productMessage,
        "Please enter a product title.",
        "error"
      );

      return;
    }

    if(!affiliate){

      showMessage(
        productMessage,
        "Please enter the affiliate link.",
        "error"
      );

      return;
    }

    publishBtn.disabled = true;
    publishBtn.textContent = "PUBLISHING...";

    try{

      const response =
        await fetch(`${API}/products`,{
          method:"POST",
          headers:{
            "Content-Type":
              "application/json",
            "Authorization":
              `Bearer ${adminPassword}`
          },
          body:JSON.stringify({
            title,
            description,
            affiliate_url:affiliate,
            category:selectedCategory,
            images
          })
        });

      const data =
        await response.json();

      if(!response.ok){

        throw new Error(
          data.error ||
          "Unable to publish product."
        );

      }

      showMessage(
        productMessage,
        "Product published successfully.",
        "success"
      );

      document.getElementById("title")
        .value = "";

      document.getElementById("description")
        .value = "";

      document.getElementById("affiliate")
        .value = "";

      document.getElementById("category")
        .value = "Tech";

      document.querySelectorAll(
        ".image-input"
      ).forEach(input=>{
        input.value = "";
      });

      document.querySelectorAll(
        ".preview img"
      ).forEach(img=>{
        img.style.display = "none";
        img.removeAttribute("src");
      });

      await loadProducts();

    }catch(error){

      showMessage(
        productMessage,
        error.message ||
          "Publishing failed.",
        "error"
      );

    }finally{

      publishBtn.disabled = false;
      publishBtn.textContent =
        "PUBLISH PRODUCT";

    }

  }
);


document.querySelectorAll(
  ".image-input"
).forEach((input,index)=>{

  input.addEventListener(
    "input",
    ()=>{

      const preview =
        document.getElementById(
          `preview${index + 1}`
        );

      const url =
        input.value.trim();

      if(!url){

        preview.style.display = "none";
        preview.removeAttribute("src");

        return;
      }

      preview.src = url;
      preview.style.display = "block";

      preview.onerror = ()=>{
        preview.style.display = "none";
      };

    }
  );

});


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}
</script>

</body>
</html>
